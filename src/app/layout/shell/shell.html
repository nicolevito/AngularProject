<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__sidenav"
    [mode]="modoSidenav()"
    [opened]="sidenavAberto()"
    [fixedInViewport]="true"
    (closed)="fecharSidenavMobile()"
  >
    <app-sidebar (itemClicado)="fecharSidenavMobile()" />
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <app-topbar (abrirMenu)="alternarSidenav()" />
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
